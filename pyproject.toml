[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-mcp"
dynamic = ["version"]
description = "Athena: Local-First, Evidence-Backed Multi-Language Git & AST Change Intelligence, Breaking-Change, and Release Notes MCP Server"
readme = "README.md"
license = "Apache-2.0"
keywords = ["mcp", "git", "ast", "release-notes", "breaking-changes", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
authors = [
    { name = "Aaryan Rawat", email = "aaryan28rwt@gmail.com" },
]
maintainers = [
    { name = "Aaryan Rawat", email = "aaryan28rwt@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0,<3",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/aaryanrwt/athena"
Repository = "https://github.com/aaryanrwt/athena"
Issues = "https://github.com/aaryanrwt/athena/issues"
Security = "https://github.com/aaryanrwt/athena/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
security = [
    "pip-audit==2.10.1",
]

[project.scripts]
athena = "athena.cli:main"
athena-mcp = "athena.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "athena.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
norecursedirs = ["cache", ".git", ".venv", "__pycache__", "build", "dist"]
markers = [
    "ollama: live integration tests that require an explicitly enabled local Ollama service",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/evaluation/cache", "examples/demo_repo", ".venv", "build", "dist", "**/__pycache__"]


