# Rust port of athena.security.redact_secrets, generated by fast-anything.
[package]
name = "fa_athena_security_redact_secrets"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "fa_athena_security_redact_secrets"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
regex = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# A crate of its own, even inside another Cargo workspace.
[workspace]
