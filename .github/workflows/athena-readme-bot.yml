name: Athena README Badge & Star-History Bot

on:
  watch:
    types: [started]
  release:
    types: [published, created, edited]
  push:
    branches: [main]
    paths-ignore:
      - "assets/star-history.svg"
      - "assets/badges/**"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: athena-readme-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Refresh Self-Hosted Badges & Star History + Check External Badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme_assets.py --repo "${{ github.repository }}" --assets-dir assets --readme README.md --check-external

      - name: Commit & Push Updated README Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg assets/badges/
          if ! git diff --cached --quiet; then
            git commit -m "chore(bot): update README badges and star history [skip ci]"
            git push
          fi
