name: Update Star History Chart

on:
  watch:
    types: [started]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_star_history.py"
      - ".github/workflows/star-history.yml"

concurrency:
  group: star-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-star-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Generate Modern Star History SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_star_history.py --repo "${{ github.repository }}" --output assets/star-history.svg

      - name: Commit Updated Star History SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(readme): update star history chart [skip ci]"
            git push
          fi
